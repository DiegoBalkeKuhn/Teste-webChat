<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Webchat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 50px;
            text-align: center;
        }
    </style>

    <!-- Webchat Widget -->
<script src="https://omniapi-dev.sejat1.com.br/static/webchat/webchat.min.js?v=1791314985172" async></script>
<script>
(function boot(){ if (window.NewOmniChat && typeof window.NewOmniChat.init === 'function') { window.NewOmniChat.init({
  "server": "https://omniapi-dev.sejat1.com.br",
  "channelId": "49",
  "auth": {
    "mode": "prechat"
  },
  "locale": "pt-BR"
}); } else { setTimeout(boot, 50); } })();
</script>
</head>
<body>
    <h1>Meu Site de Teste</h1>
    <p>O webchat deve aparecer no canto inferior direito, burlando a tela de aviso do ngrok.</p>
</body>
</html>
